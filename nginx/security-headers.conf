# 보안 응답 헤더 (2026-11-09, 감사 M3) — nginx.conf.template 의 server 와, add_header 를 가진
# location 마다 include 한다. nginx 는 location 에 add_header 가 하나라도 있으면 server 단계의
# add_header 를 상속하지 않기 때문 (index.html·/·/assets/ 가 그런 location).
# always: 4xx/5xx 응답에도 붙인다 (기본은 2xx/3xx 만).

# CSP — 1단계는 Report-Only (차단하지 않고 위반만 /api/csp-report → backend 로그 csp_violation).
# 실제 사용에서 위반이 없음을 확인한 뒤 Content-Security-Policy(강제)로 바꾼다.
#   script  : 번들만('self') — 인라인·eval 없음(번들 검사 eval/new Function 0)
#   style   : 번들 CSS + pretendard 웹폰트 CSS(cdn.jsdelivr.net). React·framer-motion 의 style 은
#             CSSOM(element.style) 이라 style-src 대상 아님
#   img     : 같은 출처(MinIO 프록시 /clog-media*) + 카카오 프로필(*.kakaocdn.net) + 업로드 미리보기(blob:)
#   media   : 같은 출처 영상 + 업로드 미리보기(blob:)
#   connect : API·presigned 업로드 모두 같은 출처
#   form-action: 카카오 로그인은 302 이동이지만 폼 전송 대상이 될 수 있어 kauth 포함
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.kakaocdn.net; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://kauth.kakao.com; report-uri /api/csp-report" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS 1년. includeSubDomains·preload 는 하위 도메인 정리 전까지 보류
add_header Strict-Transport-Security "max-age=31536000" always;
