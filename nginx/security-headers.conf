# 보안 응답 헤더 (2026-11-09, 감사 M3) — nginx.conf.template 의 server 와, add_header 를 가진
# location 마다 include 한다. nginx 는 location 에 add_header 가 하나라도 있으면 server 단계의
# add_header 를 상속하지 않기 때문 (index.html·/·/assets/ 가 그런 location).
# always: 4xx/5xx 응답에도 붙인다 (기본은 2xx/3xx 만).

# CSP — 2단계 강제 (2026-11-12, M3). 1단계 Report-Only(11-10~)의 위반 7일 41건을 분석해 반영했다.
# 강제 후에도 위반은 /api/csp-report → backend 로그 csp_violation 으로 계속 수집한다.
#   script  : 번들만('self') — 인라인·eval 없음(번들 검사 eval/new Function 0)
#             + Cloudflare Web Analytics beacon(Cloudflare 가 응답에 자동 삽입, 위반 26건)
#   style   : 번들 CSS + pretendard 웹폰트 CSS(cdn.jsdelivr.net). React·framer-motion 의 element.style 은
#             CSSOM 이라 대상 아님.
#             + 'sha256-47DEQ…' = **빈 문자열** 해시: framer-motion AnimatePresence mode="popLayout"
#             (AppLayout 화면 전환)이 빈 <style> 을 넣고 insertRule(CSSOM)로 규칙을 채운다(위반 15건).
#             강제 시 막히면 sheet=null → 사라지는 페이지 위치 고정이 빠진다. 빈 내용만 허용이라
#             내용이 있는 inline <style> 은 계속 차단(Chromium 실험으로 둘 다 확인).
#             framer-motion 을 올릴 때 이 방식이 바뀌면 다시 확인(위반이 csp_violation 으로 보임).
#   img     : 같은 출처(MinIO 프록시 /clog-media*) + 카카오 프로필(*.kakaocdn.net) + 업로드 미리보기(blob:)
#             카카오 프로필은 https 만: backend 가 secure_resource=true 로 받고, 옛 http 행은 마이그레이션
#             6a4fc0e704e9 로 변환(2026-11-12, prod 는 이미 0건이었음).
#             http 주소일 때의 브라우저 동작(2026-11-13 prod 실측, Chromium): https 페이지에서 **강제** CSP 는
#             mixed content 자동 업그레이드 뒤 https 로 통과, **Report-Only** 는 올리기 전 http 주소로 위반을
#             보고(실제 요청은 https). Firefox·Safari 는 미확인 → DB 를 https 로 유지하는 것이 기준.
#             e2e/csp_enforce.py C5 는 http 페이지(업그레이드 없음)에서 http 차단·https 허용을 본다.
#   media   : 같은 출처 영상 + 업로드 미리보기(blob:)
#   connect : API·presigned 업로드 모두 같은 출처 + Web Analytics 전송(cloudflareinsights.com)
#   form-action: 카카오 로그인은 302 이동이지만 폼 전송 대상이 될 수 있어 kauth 포함
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' https://cdn.jsdelivr.net 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.kakaocdn.net; media-src 'self' blob:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://kauth.kakao.com; report-uri /api/csp-report" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS 1년. includeSubDomains·preload 는 하위 도메인 정리 전까지 보류
add_header Strict-Transport-Security "max-age=31536000" always;
