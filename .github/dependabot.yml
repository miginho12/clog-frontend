# Dependabot (H1 재발 방지, 2026-11-09)
# - 마이너·패치는 생태계별 PR 하나로 묶는다 (PR 폭주 방지)
# - 메이저는 묶지 않고 개별 PR — 직접 판단 (자동 병합 없음)
# - PR 에서도 docker-build.yml 의 test(eslint·tsc·npm audit 게이트)가 돈다
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # node 메이저(24 → 26)는 빌드 도구 체인 영향 — L1 에서 직접 진행
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
