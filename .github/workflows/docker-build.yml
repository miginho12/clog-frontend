name: Docker Build & Push (Frontend)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # 주간 정기 검사 (H1 재발 방지, 2026-11-09): push 가 없어도 새 GHSA 를
  # npm audit 게이트로 잡아 notify-failure → Discord. 월 00:00 UTC = 09:00 KST
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # miginho12/clog-frontend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npx tsc -b --noEmit

      - name: Security audit (npm audit)
        run: |
          npm audit --json > audit.json || true
          python3 -c "
          import json
          with open('audit.json') as f:
              data = json.load(f)
          # GHSA-g3hv-75wg-m249: minimatch 7.0.0~11.0.0 globparts 증폭 DoS.
          # eslint 10.14 / typescript-eslint 8.72 가 minimatch ^10 에 고정돼 있어
          # 범위 내 수정이 없고, npm 제안은 eslint 9 다운그레이드(breaking)뿐.
          # 개발 도구 전용(번들 미포함)이고 패턴은 우리 eslint 설정에서만 와
          # 외부 입력이 닿지 않음 → 예외 처리(2026-11-09). eslint 가 minimatch 11+
          # 로 올라가면 Dependabot 갱신과 함께 이 예외를 지울 것.
          # (2026-11-09 삭제: GHSA-qwww-vcr4-c8h2 react-router — 업데이트로 해소)
          ALLOWED = {'GHSA-g3hv-75wg-m249'}
          vulns = data.get('vulnerabilities', {})
          unexpected = []
          for name, v in vulns.items():
              for via in v.get('via', []):
                  if isinstance(via, dict):
                      ghsa = via.get('url', '').rsplit('/', 1)[-1]
                      if ghsa not in ALLOWED:
                          unexpected.append(f'{name}: {ghsa}')
          if unexpected:
              print('New/unexpected vulnerabilities found:')
              for u in unexpected:
                  print(f'  - {u}')
              raise SystemExit(1)
          print('No unexpected vulnerabilities (only documented exceptions).')
          "

  build:
    needs: test
    # 정기 검사·수동 실행은 test 만 — 이미지 push·gitops 태그 bump 를 하지 않는다
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 빌드 ID(version.json·화면 코드) = 커밋 SHA (감사 M7)
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps image tag
        if: github.event_name != 'pull_request'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "Updating frontend values-dev.yaml image tag to ${SHA_TAG}"

          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/miginho12/gitops.git /tmp/gitops
          cd /tmp/gitops

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          sed -i "s/^  tag: .*/  tag: \"${SHA_TAG}\"/" apps/clog-frontend/values-dev.yaml

          git add apps/clog-frontend/values-dev.yaml
          git diff --cached --quiet && echo "No changes, skipping commit" && exit 0
          git commit -m "chore: bump clog-frontend image tag to ${SHA_TAG}"
          git push

  notify-failure:
    needs: [test, build]
    if: always() && contains(needs.*.result, 'failure') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on CI failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ **clog-frontend** CI 실패 (${{ github.ref_name }})\\n커밋: \`${{ github.sha }}\`\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
